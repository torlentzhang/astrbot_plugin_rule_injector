<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>规则注入器</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <div class="brand">
          <h1>规则注入器</h1>
        </div>
        <div class="header-actions">
          <span id="status" class="status" role="status"></span>
        </div>
      </header>

      <div class="toolbar">
        <nav class="tabs" role="tablist">
          <button
            type="button"
            class="tab is-active"
            role="tab"
            data-tab="rules"
            aria-selected="true"
          >
            规则配置
          </button>
          <button
            type="button"
            class="tab"
            role="tab"
            data-tab="thoughts"
            aria-selected="false"
          >
            自定义思维链
          </button>
        </nav>

        <div class="toolbar-actions" data-for="rules">
          <button id="add" type="button" class="btn-secondary">
            + 新增规则
          </button>
          <button id="save" type="button" class="btn-primary">保存</button>
        </div>

        <div class="toolbar-actions" data-for="thoughts" hidden>
          <button id="add-thought" type="button" class="btn-secondary">
            + 新增思维链
          </button>
          <button id="save-thoughts" type="button" class="btn-primary">
            保存
          </button>
        </div>
      </div>

      <!-- 规则配置 -->
      <section class="tab-panel is-active" data-panel="rules" role="tabpanel">
        <p class="footnote footnote-top">
          点击任意一行可以查看和编辑详细内容。按列表顺序从上到下拼接追加到末尾。
          内容为空的规则会被忽略。保存后立即生效，无需重启。
        </p>

        <div id="rule-list" class="rule-list"></div>

        <div class="list-actions">
          <span id="counter" class="list-counter"></span>
        </div>
      </section>

      <!-- 思维链 -->
      <section class="tab-panel" data-panel="thoughts" role="tabpanel">
        <p class="footnote footnote-top">
          只写「怎么想」，标签和格式由插件拼好，效果：
        </p>

        <pre class="snippet">&lt;关键词&gt;这是你的内心活动（你写的内容）&lt;/关键词&gt;</pre>

        <p class="footnote footnote-top">
          每条链还能填「示例念头」，用一句真实的内心话示范标签里写什么，模型会更稳地照着输出。留空时自动复用规则内容，不会发给用户。
        </p>

        <div id="thought-list" class="rule-list"></div>

        <div class="list-actions">
          <span id="thought-counter" class="list-counter"></span>
        </div>
      </section>
    </main>

    <!-- 规则抽屉 -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true">
      <header class="drawer-head">
        <h2 id="drawer-title">编辑规则</h2>
        <button type="button" class="drawer-close" id="drawer-close" aria-label="关闭">×</button>
      </header>

      <div class="drawer-body">
        <label class="field-col">
          <span class="field-label">名称</span>
          <input type="text" id="d-name" class="text-input" maxlength="60" placeholder="给这条规则起个名字" />
        </label>

        <label class="field-col">
          <span class="field-label">生效范围</span>
          <select id="d-scope" class="text-input">
            <option value="all">通用（群聊 + 私聊）</option>
            <option value="group">仅群聊</option>
            <option value="private">仅私聊</option>
          </select>
        </label>

        <div class="field-col field-grow">
          <div class="field-head">
            <span class="field-label">规则内容</span>
            <span class="chars" id="d-chars">0 字</span>
          </div>
          <textarea id="d-content" class="text-area" spellcheck="false" placeholder="规则正文，原样注入系统提示词"></textarea>
        </div>
      </div>

      <footer class="drawer-foot">
        <button type="button" class="btn-danger" id="d-delete">删除这条规则</button>
        <button type="button" class="btn-primary" id="d-done">保存</button>
      </footer>
    </aside>

    <!-- 思维链抽屉 -->
    <div class="drawer-overlay" id="tdrawer-overlay"></div>
    <aside class="drawer" id="tdrawer" role="dialog" aria-modal="true" aria-hidden="true">
      <header class="drawer-head">
        <h2 id="tdrawer-title">编辑思维链</h2>
        <button type="button" class="drawer-close" id="tdrawer-close" aria-label="关闭">×</button>
      </header>

      <div class="drawer-body">
        <label class="field-col">
          <span class="field-label">名称</span>
          <input type="text" id="t-name" class="text-input" maxlength="60" placeholder="给这条思维链起个名字" />
        </label>

        <label class="field-col">
          <div class="field-head">
            <span class="field-label">关键词</span>
            <span class="chars">剥离 <code>&lt;关键词&gt;…&lt;/关键词&gt;</code></span>
          </div>
          <input type="text" id="t-keyword" class="text-input" maxlength="12" placeholder="例如：思维链" />
          <span class="field-hint">不要用 think，会导致只有首轮生效。</span>
        </label>

        <div class="field-col field-grow">
          <div class="field-head">
            <span class="field-label">规则内容</span>
            <span class="chars" id="t-chars">0 字</span>
          </div>
          <textarea id="t-content" class="text-area" spellcheck="false" placeholder="告诉模型怎么用这个标记写内心话"></textarea>
        </div>

        <div class="field-col">
          <div class="field-head">
            <span class="field-label">示例念头（可选）</span>
            <span class="chars" id="t-example-chars">0 字</span>
          </div>
          <textarea id="t-example" class="text-area text-area-short" maxlength="500" spellcheck="false" placeholder="写一句这条思维链的真实念头，例如：他突然找我，我有点意外。"></textarea>
          <span class="field-hint">给模型示范「标签里放的是具体念头，不是规则文字」。留空则自动复用上面的规则内容。只用于注入示例，不会发给用户，也不写进会话历史。</span>
        </div>
      </div>

      <footer class="drawer-foot">
        <button type="button" class="btn-danger" id="t-delete">删除这条思维链</button>
        <button type="button" class="btn-primary" id="t-done">保存</button>
      </footer>
    </aside>

    <!-- 确认对话框 -->
    <div class="confirm-overlay" id="confirm-overlay" hidden>
      <div class="confirm-box" role="alertdialog" aria-modal="true">
        <p class="confirm-text" id="confirm-text"></p>
        <div class="confirm-actions">
          <button type="button" class="btn-secondary" id="confirm-cancel">取消</button>
          <button type="button" class="btn-danger-solid" id="confirm-ok">删除</button>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
